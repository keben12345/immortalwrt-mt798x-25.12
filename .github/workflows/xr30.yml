name: Build ImmortalWrt 25.12-xr30


on:
  workflow_dispatch:
  # schedule:
  #  - cron: '0 0 * * *'


permissions:
  contents: write


jobs:
  build:

    runs-on: ubuntu-24.04


    steps:

    - name: Checkout config
      uses: actions/checkout@v4
      with:
        fetch-depth: 1


    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo apt-get clean

        df -h


    - name: Clone ImmortalWrt source
      run: |

        git clone \
        --depth=1 \
        -b 25.12 \
        https://github.com/chasey-dev/immortalwrt-mt798x-rebase.git \
        openwrt


    - name: Prepare feeds
      run: |

        cd openwrt

        ./scripts/feeds update -a
        ./scripts/feeds install -a

     
    - name: Fix Rust build
      run: |
        cd openwrt

        echo "=========================================="
        echo "Rust package information"
        echo "=========================================="

        RUST_MAKEFILE="feeds/packages/lang/rust/Makefile"

        if [ ! -f "$RUST_MAKEFILE" ]; then
          echo "ERROR: Rust Makefile not found!"
          exit 1
        fi

        grep -nE \
          'PKG_VERSION|PKG_RELEASE|RUST_VERSION|LLVM|download-ci-llvm' \
          "$RUST_MAKEFILE" || true

        echo "=========================================="
        echo "Disable Rust CI LLVM download"
        echo "=========================================="

        # Rust 1.94.0 当前 Makefile 中：
        #
        # --set=llvm.download-ci-llvm=true
        #
        # 改为 false，避免 bootstrap 尝试下载
        # 已不存在/不匹配的 CI LLVM artifact。

        sed -i \
          's/--set=llvm\.download-ci-llvm=true/--set=llvm.download-ci-llvm=false/g' \
          "$RUST_MAKEFILE"

        echo "=========================================="
        echo "Verify Rust configuration"
        echo "=========================================="

        grep -n \
          "download-ci-llvm" \
          "$RUST_MAKEFILE" || true

        echo "=========================================="
        echo "Rust version"
        echo "=========================================="

        grep -n \
          "PKG_VERSION" \
          "$RUST_MAKEFILE" || true

    - name: Apply config
      run: |

        cp defconfig/xr30.config \
        openwrt/.config


        cd openwrt
        
        # 修改默认 LAN IP 为 192.168.1.88
        sed -i 's/192.168.1.1/192.168.1.88/g' package/base-files/files/bin/config_generate
        
        make defconfig


        echo "===== Target ====="

        grep qihoo .config || true


    - name: Download sources
      run: |

        cd openwrt

        make download -j2

        df -h



    - name: Build firmware
      run: |

        cd openwrt

        make -j2


    - name: Upload firmware
      uses: actions/upload-artifact@v4
      with:
          name: immortalwrt-25.12-rax3000m-firmware
          path: openwrt/bin/targets/mediatek/filogic/
          if-no-files-found: warn

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v1
      with:
          name: "RAX3000M 固件 ${{ steps.date.outputs.date }} #${{ github.run_number }}"
          tag_name: "build-${{ steps.date.outputs.date }}-${{ github.run_number }}"
          body: |
            ## 自动编译固件
            
            - 编译时间：${{ steps.date.outputs.date }}
            - 编译编号：#${{ github.run_number }}
            - 设备：CMCC xr30 (eMMC / NAND)
            - 内核：6.12（25.12 版本）
            - 包含插件：OpenClash、磁盘管理、Argon 主题等
          files: openwrt/bin/targets/mediatek/filogic/*


      env:

        GITHUB_TOKEN:
          ${{ secrets.GITHUB_TOKEN }}
